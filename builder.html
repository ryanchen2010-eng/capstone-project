<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Draw a small molecule in 2D, check its structure, and generate an interactive 3D model."
    />
    <title>Molecule Builder</title>
    <script src="https://3dmol.org/build/3Dmol-min.js"></script>
  </head>
  <body>
    <div id="builder-app"></div>
    <script>
      window.addEventListener('error', (event) => {
        const root = document.querySelector('#builder-app');
        if (root && !root.hasChildNodes()) root.textContent = `Builder could not start: ${event.message}`;
        const status = document.querySelector('#builder-status');
        if (status) status.textContent = `Drawing editor error: ${event.message}`;
      });
      window.addEventListener('unhandledrejection', (event) => {
        const status = document.querySelector('#builder-status');
        if (status) status.textContent = `Drawing editor error: ${event.reason?.message || event.reason}`;
      });
    </script>
    <script type="module" src="/src/builder.ts"></script>
  </body>
</html>
